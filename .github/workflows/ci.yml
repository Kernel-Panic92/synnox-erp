name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm audit --prod
        name: Security audit

      - run: >
          find . -name '*.js' -not -path './node_modules/*'
          -not -path './.pnpm-store/*' -not -path './modules/*/node_modules/*'
          -exec node --check {} +
        name: Syntax check

[synnox-login]
enabled  = true
port     = http,https
filter   = synnox-login
logpath  = /var/log/nginx/access.log
backend  = auto
maxretry = 5
findtime = 10m
bantime  = 30m
bantime.increment = true
bantime.factor = 2
bantime.maxtime = 1d
ignoreip = 127.0.0.1/8 ::1
action   = nftables-multiport[name=synnox-login, port="http,https", protocol=tcp]
